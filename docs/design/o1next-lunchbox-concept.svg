<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="860" fill="#ffffff"/>
  <text x="640" y="50" font-size="30" font-weight="bold" text-anchor="middle" fill="#1D4E9C">OSBORNE 1 NG — lunchbox concept</text>
  <text x="640" y="80" font-size="15" text-anchor="middle" fill="#555555">Form factor 2 (issue #52) · O1A blue/grey livery · keyboard seals the unit · up to 250 mm wide · about 80 mm thick</text>

  <!-- PANEL A : CLOSED / TRANSPORT -->
  <text x="220" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">CLOSED / TRANSPORT</text>
