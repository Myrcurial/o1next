  <g fill="#4A4A48" stroke="#2c2c2a" stroke-width="0.6">
    <rect x="86" y="252" width="19" height="24" rx="2"/><rect x="108" y="252" width="19" height="24" rx="2"/><rect x="130" y="252" width="19" height="24" rx="2"/><rect x="152" y="252" width="19" height="24" rx="2"/><rect x="174" y="252" width="19" height="24" rx="2"/><rect x="196" y="252" width="19" height="24" rx="2"/><rect x="218" y="252" width="19" height="24" rx="2"/><rect x="240" y="252" width="19" height="24" rx="2"/><rect x="262" y="252" width="19" height="24" rx="2"/><rect x="284" y="252" width="19" height="24" rx="2"/><rect x="306" y="252" width="19" height="24" rx="2"/><rect x="328" y="252" width="19" height="24" rx="2"/>
    <rect x="86" y="281" width="19" height="24" rx="2"/><rect x="108" y="281" width="19" height="24" rx="2"/><rect x="130" y="281" width="19" height="24" rx="2"/><rect x="152" y="281" width="19" height="24" rx="2"/><rect x="174" y="281" width="19" height="24" rx="2"/><rect x="196" y="281" width="19" height="24" rx="2"/><rect x="218" y="281" width="19" height="24" rx="2"/><rect x="240" y="281" width="19" height="24" rx="2"/><rect x="262" y="281" width="19" height="24" rx="2"/><rect x="284" y="281" width="19" height="24" rx="2"/><rect x="306" y="281" width="19" height="24" rx="2"/><rect x="328" y="281" width="19" height="24" rx="2"/>
    <rect x="86" y="310" width="19" height="24" rx="2"/><rect x="108" y="310" width="19" height="24" rx="2"/><rect x="130" y="310" width="19" height="24" rx="2"/><rect x="152" y="310" width="19" height="24" rx="2"/><rect x="174" y="310" width="19" height="24" rx="2"/><rect x="196" y="310" width="19" height="24" rx="2"/><rect x="218" y="310" width="19" height="24" rx="2"/><rect x="240" y="310" width="19" height="24" rx="2"/><rect x="262" y="310" width="19" height="24" rx="2"/><rect x="284" y="310" width="19" height="24" rx="2"/><rect x="306" y="310" width="19" height="24" rx="2"/><rect x="328" y="310" width="19" height="24" rx="2"/>
    <rect x="86" y="339" width="19" height="24" rx="2"/><rect x="108" y="339" width="19" height="24" rx="2"/><rect x="130" y="339" width="19" height="24" rx="2"/><rect x="152" y="339" width="19" height="24" rx="2"/><rect x="174" y="339" width="19" height="24" rx="2"/><rect x="196" y="339" width="19" height="24" rx="2"/><rect x="218" y="339" width="19" height="24" rx="2"/><rect x="240" y="339" width="19" height="24" rx="2"/><rect x="262" y="339" width="19" height="24" rx="2"/><rect x="284" y="339" width="19" height="24" rx="2"/><rect x="306" y="339" width="19" height="24" rx="2"/><rect x="328" y="339" width="19" height="24" rx="2"/>
    <rect x="86" y="368" width="28" height="24" rx="2"/><rect x="118" y="368" width="19" height="24" rx="2"/>
    <rect x="141" y="368" width="140" height="24" rx="2" fill="#3a3a38"/>
