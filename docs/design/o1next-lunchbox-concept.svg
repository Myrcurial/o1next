  <rect x="86" y="456" width="34" height="10" rx="3" fill="#8f8f88"/>
  <rect x="320" y="456" width="34" height="10" rx="3" fill="#8f8f88"/>
  <line x1="60" y1="492" x2="380" y2="492" stroke="#333333" stroke-width="1"/>
  <line x1="60" y1="485" x2="60" y2="499" stroke="#333333" stroke-width="1"/>
  <line x1="380" y1="485" x2="380" y2="499" stroke="#333333" stroke-width="1"/>
  <text x="220" y="512" font-size="13" text-anchor="middle" fill="#333333">up to 250 mm (fits common 3D-printer beds)</text>

  <!-- PANEL B : OPEN / OPERATING -->
  <text x="620" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">OPEN / OPERATING</text>
  <rect x="460" y="180" width="320" height="290" rx="14" fill="#C7C7C1" stroke="#555555" stroke-width="2"/>
  <rect x="480" y="198" width="280" height="216" rx="6" fill="#26282B"/>
  <rect x="492" y="208" width="256" height="192" fill="#0A0A0A"/>
  <text x="504" y="234" font-size="13" font-family="Courier, monospace" fill="#C8C8C8">OSBORNE 1 NG — CP/M 2.2</text>
  <text x="504" y="254" font-size="13" font-family="Courier, monospace" fill="#C8C8C8">64K RAM · DUAL DRIVE READY</text>
  <text x="504" y="296" font-size="13" font-family="Courier, monospace" fill="#C8C8C8">A&gt;_</text>
  <text x="620" y="408" font-size="10" text-anchor="middle" fill="#888888">8-inch 4:3 LCD (composite or HDMI in)</text>
  <rect x="460" y="420" width="320" height="22" fill="#1D4E9C"/>
  <text x="475" y="436" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1.5">OSBORNE 1 NG</text>
  <rect x="480" y="450" width="150" height="6" rx="3" fill="#3a3a38"/>
  <rect x="640" y="446" width="34" height="14" rx="2" fill="#0d2a52" stroke="#1D4E9C" stroke-width="1"/>
  <rect x="692" y="448" width="26" height="10" rx="3" fill="none" stroke="#555555" stroke-width="1.5"/>
  <circle cx="742" cy="453" r="7" fill="#8f8f88" stroke="#555555" stroke-width="1"/>
  <text x="480" y="482" font-size="10" fill="#555555">Gotek slot + OLED · USB-C PD (15–20 V in) · power</text>
  <g transform="rotate(8 620 560)">
    <rect x="480" y="520" width="280" height="86" rx="6" fill="#B0B0AA" stroke="#555555" stroke-width="1.5"/>
    <g fill="#4A4A48">
      <rect x="492" y="532" width="248" height="10" rx="2"/>
      <rect x="492" y="548" width="248" height="10" rx="2"/>
      <rect x="492" y="564" width="248" height="10" rx="2"/>
      <rect x="492" y="580" width="160" height="12" rx="2" fill="#3a3a38"/>
    </g>
  </g>
  <text x="620" y="636" font-size="11" text-anchor="middle" fill="#555555">keyboard flips down / detaches — original layout, keypad omitted</text>


  <!-- PANEL C : SIDE PROFILE -->
  <text x="1020" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">SIDE PROFILE</text>
  <rect x="900" y="180" width="100" height="290" rx="10" fill="#C7C7C1" stroke="#555555" stroke-width="2"/>
  <rect x="900" y="198" width="100" height="18" fill="#1D4E9C"/>
  <rect x="866" y="420" width="34" height="110" rx="6" fill="#B0B0AA" stroke="#555555" stroke-width="1.5" transform="rotate(35 900 470)"/>
  <rect x="1000" y="240" width="60" height="180" rx="6" fill="#B9B9B2" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1012" y1="280" x2="1048" y2="280" stroke="#555555" stroke-width="1.5"/>
  <circle cx="1052" cy="288" r="2.5" fill="#1D4E9C"/>
  <text x="1030" y="446" font-size="10" text-anchor="middle" fill="#555555">optional 5.25-inch</text>
  <text x="1030" y="458" font-size="10" text-anchor="middle" fill="#555555">HH drive backpack</text>
  <line x1="900" y1="492" x2="1000" y2="492" stroke="#333333" stroke-width="1"/>
  <line x1="900" y1="485" x2="900" y2="499" stroke="#333333" stroke-width="1"/>
  <line x1="1000" y1="485" x2="1000" y2="499" stroke="#333333" stroke-width="1"/>
  <text x="950" y="512" font-size="13" text-anchor="middle" fill="#333333">~80 mm</text>
  <line x1="1000" y1="522" x2="1060" y2="522" stroke="#333333" stroke-width="1"/>
  <text x="1030" y="538" font-size="12" text-anchor="middle" fill="#333333">+45 mm</text>

  <!-- footer notes -->
  <text x="60" y="700" font-size="13" font-weight="bold" fill="#333333">Design notes</text>
  <text x="60" y="722" font-size="12" fill="#444444">- Power: USB-C PD trigger (15-20 V) to on-board +5 V / +12 V regulators; internal 4S 18650 pack optional; the original PSU (and its RIFA caps) retired.</text>
  <text x="60" y="740" font-size="12" fill="#444444">- Livery: O1A blue/grey — grey ABS shell, blue accent stripe, white branding. Not the beige O1.</text>
  <text x="60" y="758" font-size="12" fill="#444444">- Keyboard: Cherry MX implementation of the original matrix (#47); keypad omitted (it only duplicates the number row).</text>
  <text x="60" y="776" font-size="12" fill="#444444">- Backpack mirrors the Compaq Portable III rear-expansion trick — bolt-on bay for a real 5.25-inch half-height drive.</text>
  <text x="60" y="806" font-size="11" fill="#888888">Concept illustration, not to scale · o1next · issue #52</text>
</svg>

