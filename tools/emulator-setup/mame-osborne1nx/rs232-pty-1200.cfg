<?xml version="1.0"?>
<!--
    rs232-pty-1200.cfg : **DOES NOT WORK.  Kept as the record of why.**

    This file was written on 2026-10-20 on the belief that a CONFIG port's value can
    be set by putting it in cfg/<machine>.cfg.  Measured 2026-10-23, it cannot:
    MAME does **not** apply type="CONFIG" port entries from the cfg file at all.

    The evidence, all of it reproducible in a minute:

      * the pty stays at its 9600 default whatever this file says.  Setting
        RS232_TXBAUD to 50, 1200 or 9600 gives byte-for-byte identical behaviour:
        a 1200-baud ACIA receives one garbage byte per four written (FE for
        "OK" CR LF), with the overrun flag set.
      * -cfg_directory <dir> pointing straight at this file changes nothing.
      * MAME **drops the entry** when it writes the cfg back, which is what a value
        it never read looks like.

    What actually sets the rate is O1_PTY_BAUD, read by the patched pty device
    (src/devices/bus/rs232/pty.cpp in osborne1nx.patch), and boot-o1next.sh passes
    it from O1_BAUD.  With that in place a 1200-baud ACIA decodes OK CR LF byte for
    byte.

    Two more things measured the same day, both needed for a session to work:

      * MAME hands the ACIA a **buffered burst** rather than pacing it at the wire
        rate (two bytes landed 0.2 ms apart), so serial-relay-o1next.py now paces
        the far end's bytes one character at a time (its pty-baud option).  Without
        that only the first byte of every reply survives, because a 6850 has a
        one-byte receive register.
      * the guest and the pty must still agree: the O1's default is 1200, MDM740's
        is 300, and O1_BAUD is how the pty is told which.

    The two entries below are inert.  They are left so the file still parses as the
    cfg it claims to be, and so nobody re-derives the same wrong idea from the
    numbers: RS232_BAUD_300 = 2, RS232_BAUD_1200 = 4, RS232_BAUD_9600 = 7.
-->
<mameconfig version="10">
    <system name="osborne1nx">
        <input>
            <port tag=":rs232:pty:RS232_TXBAUD" type="CONFIG" mask="255" defvalue="7" value="4" />
            <port tag=":rs232:pty:RS232_RXBAUD" type="CONFIG" mask="255" defvalue="7" value="4" />
        </input>
    </system>
</mameconfig>
