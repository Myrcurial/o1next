<?xml version="1.0"?>
<!--
    rs232-pty-1200.cfg -- make MAME's rs232 pty match the Osborne's ACIA.

    Copy this to `cfg/osborne1nx.cfg` in the directory MAME is run from, and the pty
    device's two baud ports come up at 1200 instead of their 9600 default.

    WHY THIS IS NECESSARY, AND WHY IT COSTS AN HOUR TO FIND

    The pty device is a `device_serial_interface`: it decodes the ACIA's TXD line into
    bytes at RS232_RXBAUD, and encodes the pty's bytes onto RXD at RS232_TXBAUD.  Both
    default to 9600.  The Osborne's ACIA does not: the driver's "Serial Speed" config
    (osborne1.cpp, PORT_CONFNAME "Serial Speed") offers 300/1200, 600/2400, 1200/4800
    and 2400/9600, and **the default is 300/1200**.  So a stock machine is 1200 baud at
    its high setting and 300 at its low one, and a 9600 pty sampling a 1200 ACIA
    produces garbage -- measured, it turned `AT` + CR (41 54 0d) into 78 f8 00 78 78 00
    on the wire, which looks like a wiring fault and is not one.

    These ports are NOT settable on the command line -- `-rs232:pty:RS232_TXBAUD` is
    rejected as an unknown option, in every tag form tried.  MAME writes and reads them
    in `cfg/<machine>.cfg`, which is what this file is.

    The values: RS232_BAUD_300 = 0x02, RS232_BAUD_1200 = 0x04, RS232_BAUD_9600 = 0x07
    (src/devices/bus/rs232/rs232.h), and the port is a PORT_CONFNAME(0xff, ...) so the
    mask is 255.  `defvalue="7"` is 9600; `value="4"` is 1200.

    AND THE GUEST HAS TO SELECT THE SAME RATE.  The 6850's control register bits CR0/CR1
    are the clock division: 00 = /1, 01 = /16, 10 = /64, 11 = master reset.  With the
    driver's 300/1200 wiring the ACIA's clock is 19200 Hz, so /16 gives 1200 and /64
    gives 300.  The two control words are therefore

        0x15  =  CR1=0 CR0=1 (/16)  +  8N1   ->  1200 baud
        0x16  =  CR1=1 CR0=0 (/64)  +  8N1   ->   300 baud

    -- and 0x16 is the one that is easy to reach for, because the two bits read as "16".
    Poking 0x16 while the pty is at 1200 is a mismatch in the other direction.

    Measured 2026-10-20: with this cfg and control word 0x15, `AT` + CR written to the
    emulated ACIA at 2A01 came back as `AT` echoed plus `OK` from the real modem, through
    the bench rig.
-->
<mameconfig version="10">
    <system name="osborne1nx">
        <input>
            <port tag=":rs232:pty:RS232_TXBAUD" type="CONFIG" mask="255" defvalue="7" value="4" />
            <port tag=":rs232:pty:RS232_RXBAUD" type="CONFIG" mask="255" defvalue="7" value="4" />
        </input>
    </system>
</mameconfig>
