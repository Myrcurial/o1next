name: generated artifacts

# The site's font family, the site's masthead and the book's chapter pages are
# *generated* and then committed, because GitHub Pages serves the repository as-is
# -- the deploy workflow builds Jekyll but does not run our tools.  That only stays
# true if the generated files are kept in step with their sources: edit a document
# in docs/ without re-running the builder and the published book silently goes
# stale, still showing the old text, and edit the boot-screen art without
# re-running rom2strokes.py and the site's masthead no longer matches the drawing.
#
# The boot screen's *code* used to be checked here too, and differently: it was the
# vendor's ACT80 assembling rom2-screen.asm, so `screen.bin` carried a digest of the
# source it was extracted from and this job failed when the source moved on without
# it (tools/research/rom2blob.py).  The ROM-side frame path retired on 2026-10-17
# (#278): the screen's code is 26 bytes in the monitor's own tail now, the asset went
# with the path, and `rom2asm.sh` checks it by value where it is built.
#
# All four tools have a --check mode for this, and none of them needs the host
# tooling that produced the files.  The PDF is deliberately *not* checked: it
# needs typst, which this runner does not have, and it is committed rather than
# built on deploy.
#
# The firmware's boot frame used to be checked here as well, rebuilt from that same
# art.  It was retired on 2026-10-16: the boot screen is now the animation the
# RP2354B plays (firmware/rom-service/boot-animation.bin, #247's W5), and no tool in
# this repo generates that from anything -- so there is nothing to compare it to,
# and the frame half of `rom2strokes.py --check` went with it.

on:
  push:
    paths:
      - 'docs/**'
      - 'research/README.md'
      - 'research/boot-screen/**'
      - 'research/source-code/BIOS-200-source/**'
      - 'book/**'
      - 'tools/romfont.py'
      - 'tools/build_book.py'
      - 'tools/research/rom2strokes.py'
      - 'site/assets/fonts/**'
      - 'site/assets/o1next-logo.png'
      - 'site/compendium/**'
      - 'site/_includes/compendium-toc.html'
      - '.github/workflows/generated-artifacts.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'research/README.md'
      - 'research/boot-screen/**'
      - 'research/source-code/BIOS-200-source/**'
      - 'book/**'
      - 'tools/romfont.py'
      - 'tools/build_book.py'
      - 'tools/research/rom2strokes.py'
      - 'site/assets/fonts/**'
      - 'site/assets/o1next-logo.png'
      - 'site/compendium/**'
      - 'site/_includes/compendium-toc.html'
      - '.github/workflows/generated-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    name: fonts + masthead + book pages match their sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The masthead and blob checks need the standard library and files in the
      # repo, and nothing else -- so they run before the one install this job
      # has to do.
      - name: Masthead matches the boot-screen art
        run: python3 tools/research/rom2strokes.py --check

      # romfont.py rebuilds the whole family to compare bytes, so it needs the
      # same build-time dependency the tool documents.
      - name: Install fonttools
        run: pip3 install fonttools brotli

      - name: Font family matches the character generator ROM
        run: python3 tools/romfont.py --check

      - name: Book pages match their source documents
        run: python3 tools/build_book.py --check
