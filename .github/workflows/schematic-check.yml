name: schematic check

# A schematic can pass structural ERC and still be electrically wrong.  The
# interposer generators once placed every symbol pin mirrored (y + py where
# KiCad needs y - py), and a '595 sat directly on top of a '165, shorting GND
# to A3.  ERC named neither fault -- the only thing that exposed them was
# exporting the netlist and reading the node lists pin by pin.
#
# tools/check_schematics.py does exactly that: it regenerates each board's
# netlist with kicad-cli and asserts the datasheet/spec invariants (Z80 DIP-40
# pinout, floppy adapter switching, connector pin usage, no coincident labels,
# no overlapping symbol bodies, ERC budget, and that the committed .kicad_sch
# still matches its generator).

on:
  push:
    paths:
      - 'hardware/**/*.kicad_sch'
      - 'hardware/**/gen_*_sch.py'
      - 'tools/check_schematics.py'
      - '.github/workflows/schematic-check.yml'
  pull_request:
    paths:
      - 'hardware/**/*.kicad_sch'
      - 'hardware/**/gen_*_sch.py'
      - 'tools/check_schematics.py'
      - '.github/workflows/schematic-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netlist:
    name: netlist + ERC invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # kicad-cli is headless; no xvfb or display is needed for sch export /
      # sch erc.  Bump the PPA major here when a newer KiCad lands.
      #
      # **And the version is asserted, because "install kicad" can quietly give
      # you a different KiCad.**  On 2026-10-21 Launchpad returned 503 for this
      # PPA, apt reported it as a *warning* rather than an error, and the install
      # fell back to Ubuntu 24.04's own KiCad 7.0.11 -- two majors older than the
      # 9.0.9 the previous run had used.  The job then failed with "Failed to load
      # schematic file" on all four boards, three of which nobody had touched:
      # a failure that reads like a broken schematic and is really a wrong tool.
      #
      # The package version is the contract, so it is checked rather than printed.
      - name: Install KiCad (official stable PPA)
        env:
          KICAD_MAJOR: 9
        run: |
          sudo add-apt-repository --yes "ppa:kicad/kicad-${KICAD_MAJOR}.0-releases"
          sudo apt-get update
          sudo apt-get install --yes kicad
          got="$(kicad-cli --version)"
          echo "kicad-cli: $got"
          case "$got" in
            "${KICAD_MAJOR}".*)
              echo "ok: kicad-cli $got"
              ;;
            *)
              echo "::error::kicad-cli is $got, expected ${KICAD_MAJOR}.x -- the PPA did not install.  A distro fallback cannot load these schematics: it fails as 'Failed to load schematic file' on every board, which reads like a broken schematic rather than a wrong tool."
              exit 1
              ;;
          esac

      - name: Check schematics
        run: python3 tools/check_schematics.py
